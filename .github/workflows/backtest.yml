# On-demand backtest on real market data (free: runs on GitHub's runners,
# where Yahoo/Wikipedia are reachable). Trigger from the Actions tab.
name: backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Backtest window (years)"
        default: "5"
      sell_rank:
        description: "Sell-rank hysteresis threshold"
        default: "40"
      top_n:
        description: "Number of positions"
        default: "5"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: .price_cache
          key: backtest-prices-${{ inputs.years }}y-${{ github.run_id }}
          restore-keys: |
            backtest-prices-${{ inputs.years }}y-

      - name: Run backtest
        run: |
          set -o pipefail   # a crash must fail the job, not vanish into tee
          python -m backtest.backtest \
            --years "${{ inputs.years }}" \
            --sell-rank "${{ inputs.sell_rank }}" \
            --top-n "${{ inputs.top_n }}" \
            --out backtest/equity_curve.csv | tee backtest/summary.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            backtest/equity_curve.csv
            backtest/summary.txt

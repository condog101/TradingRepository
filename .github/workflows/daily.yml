# Daily signal run: compute momentum signals after LSE close, ping Telegram,
# commit updated state back to the repo.
#
# Loop safety: there is deliberately NO `push` trigger, and the state commit
# message carries [skip ci], so bot commits can never re-trigger anything.
name: daily-signals

on:
  schedule:
    - cron: "45 17 * * 1-5"   # 17:45 UTC, Mon-Fri (LSE closes 16:30 London)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send message, don't write state)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (never trade on broken code)
        run: python -m pytest tests/ -q

      - name: Run daily signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: python -m momo.run_daily

      - name: Commit state back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "state: $(date -u +%F) [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Prepare dashboard site
        id: site
        run: |
          if [ -f site/data.json ]; then
            mkdir -p _site
            cp site/index.html site/data.json _site/
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "no data.json (dry run?) — skipping dashboard deploy"
          fi

      - name: Upload Pages artifact
        if: steps.site.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from momo import notify; notify.send('🚨 <b>daily-signals workflow failed</b> — check the Actions log on GitHub')"

  # Publishes the dashboard. continue-on-error because this stays broken (and
  # harmless) while the repo is private — Pages needs a public repo on the
  # free plan, and the signal run above must never be blocked by it.
  deploy-dashboard:
    needs: signal
    if: needs.signal.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable Pages if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

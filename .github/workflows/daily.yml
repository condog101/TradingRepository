# Daily signal run: compute momentum signals after US close, ping Telegram,
# commit updated state back to the repo.
#
# Loop safety: there is deliberately NO `push` trigger, and the state commit
# message carries [skip ci], so bot commits can never re-trigger anything.
name: daily-signals

on:
  schedule:
    - cron: "45 21 * * 1-5"   # 21:45 UTC, Mon-Fri (after US close year-round)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send message, don't write state)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (never trade on broken code)
        run: python -m pytest tests/ -q

      - name: Run daily signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: python -m momo.run_daily

      - name: Commit state back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "state: $(date -u +%F) [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from momo import notify; notify.send('🚨 <b>daily-signals workflow failed</b> — check the Actions log on GitHub')"
